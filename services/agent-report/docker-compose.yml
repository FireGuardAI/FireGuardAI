services:
  agent-report:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fireguard-agent-report
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fireguard-net

  # MCP sidecar: same image, exposes draft_executive_summary as an MCP
  # tool for the agentic compliance loop (see app/mcp_server.py).
  agent-report-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fireguard-agent-report-mcp
    command: ["python", "-m", "app.mcp_server"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8013:8013"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8013/mcp')\" || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fireguard-net

networks:
  fireguard-net:
    external: true
    name: fireguard-vector-store_fireguard-net
